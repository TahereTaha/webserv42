name: CI
run-name: ci automated tests
on:
  pull_request:
    branches:
      - main
jobs:
  Explore-GitHub-Actions-CI:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc nasm zsh
      - name: Run unit test
        run: make test && echo "all tests pass"
